openapi: 3.0.3
info:
  title: Gluzy - Central API Contract
  description: Especificación central de endpoints para el ecosistema GluV.IA (Mobile, Web Pública y Web Admin).
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Servidor de desarrollo local
  - url: https://api.gluvia.org/api/v1
    description: Servidor de producción / staging

paths:
  /auth/login:
    post:
      summary: Autenticación de usuario
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: usuario@gluzy.org
                password:
                  type: string
                  example: "ContraseñaSegura123!"
              required:
                - email
                - password
      responses:
        '200':
          description: Inicio de sesión exitoso con token JWT
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  tokenType:
                    type: string
                    example: Bearer
        '401':
          description: Credenciales inválidas

  /mediciones:
    get:
      summary: Obtener historial de mediciones de glucosa del usuario autenticado
      tags:
        - Mediciones
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Lista de mediciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MedicionGlucosa'
    post:
      summary: Registrar una nueva medición de glucosa
      tags:
        - Mediciones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaMedicionRequest'
      responses:
        '201':
          description: Medición registrada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicionGlucosa'

  /donaciones:
    post:
      summary: Procesar una donación para la causa de diabetes
      tags:
        - Donaciones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                donanteNombre:
                  type: string
                donanteEmail:
                  type: string
                monto:
                  type: number
                  format: float
                  example: 25.50
                metodoPago:
                  type: string
                  enum: [stripe, paypal, tarjeta]
              required:
                - donanteEmail
                - monto
                - metodoPago
      responses:
        '201':
          description: Donación registrada y procesada

components:
  schemas:
    MedicionGlucosa:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nivelGlucosa:
          type: number
          example: 110.5
          description: Nivel de glucosa en sangre (mg/dL)
        momento:
          type: string
          enum: [ayunas, antes_comer, despues_comer, antes_dormir, noche]
        insulinaInyectada:
          type: number
          nullable: true
          example: 4.0
        timestamp:
          type: string
          format: date-time
        observaciones:
          type: string

    NuevaMedicionRequest:
      type: object
      properties:
        nivelGlucosa:
          type: number
          example: 105.0
        momento:
          type: string
          enum: [ayunas, antes_comer, despues_comer, antes_dormir, noche]
        insulinaInyectada:
          type: number
          nullable: true
        observaciones:
          type: string
      required:
        - nivelGlucosa
        - momento
